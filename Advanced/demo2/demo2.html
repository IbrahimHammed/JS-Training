<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Design a form with 2 numeric input fields and buttons for basic maths operations and a result label-->
    <h1>Basic Math Operations</h1>
    <form>
        <label for="num1">Number 1:</label>
        <input type="number" id="num1" name="num1"><br><br>

        <label for="num2">Number 2:</label>
        <input type="number" id="num2" name="num2"><br><br>

        <input type="button" value="+" id="btnAdd">
        <input type="button" value="−" id="btnSubtract">
        <input type="button" value="×" id="btnMultiply">
        <input type="button" value="÷" id="btnDivide">
        <input type="button" value="^" id="btnExponent">
        <input type="button" value="%" id="btnModulus">

        <br><br>
        <label for="result">Result:</label>
        <output id="result" name="result"></output>

        <script src="demo2.js"></script>
    </form>
</body>
</html>
