<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="demo4b.css">
</head>
<body>
    <table id="calculatorTable">
        <!-- Calculator interface will be generated here -->
         <tr>
            <td colspan="3"><input type="text" id="result"></td>
            <td><input type="button" id="btnClear" value="C"></td>
        </tr>
        <tr>
            <td><input type="button" id="btn7" class="button" value="7"></td>
            <td><input type="button" id="btn8" class="button" value="8"></td>
            <td><input type="button" id="btn9" class="button" value="9"></td>
            <td><input type="button" id="btnDivide" class="button operator" value="/"></td>
        </tr>
        <tr>
            <td><input type="button" id="btn4" class="button" value="4"></td>
            <td><input type="button" id="btn5" class="button" value="5"></td>
            <td><input type="button" id="btn6" class="button" value="6"></td>
            <td><input type="button" id="btnMultiply" class="button operator" value="*"></td>
        </tr>
        <tr>
            <td><input type="button" id="btn1" class="button" value="1"></td>
            <td><input type="button" id="btn2" class="button" value="2"></td>
            <td><input type="button" id="btn3" class="button" value="3"></td>
            <td><input type="button" id="btnSubtract" class="button operator" value="-"></td>
        </tr>
        <tr>
            <td><input type="button" id="btn0" class="button" value="0"></td>
            <td><input type="button" id="btnDecimal" class="button" value="."></td>
            <td><input type="button" id="btnPower" class="button operator" value="^"></td>
            <td><input type="button" id="btnAdd" class="button operator" value="+"></td>
        </tr>
        <tr>
            <td colspan="4"><input type="button" id="btnEqual" class="button" value="="/></td>
        </tr>
    </table>

    <!-- Attach js file -->
    <script src="demo4b.js"></script>
</body>
</html>
