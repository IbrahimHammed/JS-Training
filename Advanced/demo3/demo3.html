<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="demo3.css">
</head>
<body>
    <!-- Design a form that can handle this equation mx + ny = c  -->
     <form action="" method="post">
        <div id="id1">
            a:<input type="number" id="a" name="a" required>
        </div>
        <div id="id2">
            x:<input type="number" id="x" name="x" required>
        </div>
        <div id="id3">
            ?:<input type="text" id="operator" name="operator" required>
        </div>
        <div id="id4">
            b:<input type="number" id="b" name="b" required>
        </div>
        <div id="id5">
            y:<input type="number" id="y" name="y" required>
        </div>
        <div id="id6">
            ?:<input type="text" id="equalTo" name="equalTo" value="=" required>
        </div>
        <div id="id7">
            c:<input type="text" id="c" name="c">
        </div>
        <div id="id8">
            <input type="button" value="Calculate" id="btnCalculate" >
            <input type="button" value="Reset" id="btnReset" >
        </div>

        <!-- Link your js file to the html page -->
        <script src="demo3.js"></script>
    </form>
</body>
</html>
